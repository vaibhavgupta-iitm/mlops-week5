name: CI - Main Branch with MLflow (Production)

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: write
  pull-requests: write

env:
  PYTHON_VERSION: '3.9'

jobs:
  test-and-deploy:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: ${{ env.PYTHON_VERSION }}

    - name: Cache pip dependencies
      uses: actions/cache@v3
      with:
        path: ~/.cache/pip
        key: ${{ runner.os }}-pip-${{ hashFiles('requirements.txt') }}
        restore-keys: |
          ${{ runner.os }}-pip-

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Configure Git
      run: |
        git config --global user.email "action@github.com"
        git config --global user.name "GitHub Action"

    - name: Set up Google Cloud credentials
      uses: google-github-actions/auth@v1
      with:
        credentials_json: ${{ secrets.GCP_SA_KEY }}

    - name: Set up Cloud SDK
      uses: google-github-actions/setup-gcloud@v1

    - name: Setup DVC and pull data (NOT model - using MLflow)
      run: |
        dvc remote add -f -d gcsremote gs://mlops-course-verdant-victory-473118-k0-unique-week2-2/iris-pipeline
        dvc remote modify gcsremote credentialpath $GOOGLE_APPLICATION_CREDENTIALS
        dvc pull iris-dvc-pipeline/v1_data.csv.dvc
        echo "✓ Data pulled successfully from DVC"
        echo "ℹ Models are managed by MLflow"

    - name: Run model training and log to MLflow
      id: train
      run: |
        echo "🚀 Training model and logging to MLflow..."
        python main.py \
          --data-path iris-dvc-pipeline/v1_data.csv \
          --hyperparameter-tuning \
          --mlflow-tracking-uri "${MLFLOW_TRACKING_URI:-file:./mlruns}" \
          --metrics-path iris-dvc-pipeline/metrics.txt
        
        if [ -f "iris-dvc-pipeline/metrics.txt" ]; then
          ACCURACY=$(grep "Accuracy:" iris-dvc-pipeline/metrics.txt | awk '{print $2}')
          echo "Model Accuracy: $ACCURACY"
          echo "accuracy=$ACCURACY" >> $GITHUB_OUTPUT
        fi

    - name: Check model accuracy threshold
      run: |
        ACCURACY=${{ steps.train.outputs.accuracy }}
        THRESHOLD=0.90
        echo "Checking if accuracy ($ACCURACY) >= threshold ($THRESHOLD)"
        if (( $(echo "$ACCURACY >= $THRESHOLD" | bc -l) )); then
          echo "✅ Model meets production accuracy threshold"
        else
          echo "❌ Model does not meet production threshold ($ACCURACY < $THRESHOLD)"
          exit 1
        fi

    - name: Promote model to MLflow Production
      run: |
        echo "🚀 Promoting best model to MLflow Production stage..."
        python promote_model.py \
          --mlflow-tracking-uri "${MLFLOW_TRACKING_URI:-file:./mlruns}" \
          --target-stage Production

    - name: Upload coverage reports
      uses: codecov/codecov-action@v5
      with:
        flags: main
        name: main-coverage
        token: ${{ secrets.CODECOV_TOKEN }}
      continue-on-error: true

    - name: Setup CML
      uses: iterative/setup-cml@v1

    - name: Generate Production Report
      run: |
        echo "## 🏁 Production Pipeline Report - Main Branch" > report.md
        echo "" >> report.md
        echo "### 📊 Build Information" >> report.md
        echo "- **Branch**: \`main\`" >> report.md
        echo "- **Commit**: \`${{ github.sha }}\`" >> report.md
        echo "- **Trigger**: ${{ github.event_name }}" >> report.md
        echo "- **Timestamp**: $(date -u '+%Y-%m-%d %H:%M:%S UTC')" >> report.md
        echo "" >> report.md

        echo "### 🧠 Model Training" >> report.md
        echo "- **Tracking URI**: \`${MLFLOW_TRACKING_URI:-file:./mlruns}\`" >> report.md
        echo "- **Accuracy**: ${{ steps.train.outputs.accuracy }}" >> report.md
        echo "- **Stage**: Production" >> report.md
        echo "" >> report.md

        echo "### ✅ Status Summary" >> report.md
        echo "| Step | Status |" >> report.md
        echo "|------|--------|" >> report.md
        echo "| Data Sync (DVC) | ✅ PASSED |" >> report.md
        echo "| MLflow Tracking | ✅ PASSED |" >> report.md
        echo "| Model Training | ✅ PASSED |" >> report.md
        echo "| Accuracy Check | ✅ PASSED |" >> report.md
        echo "| Model Promotion | ✅ PASSED |" >> report.md
        echo "" >> report.md

        echo "### 📈 Metrics" >> report.md
        if [ -f "iris-dvc-pipeline/metrics.txt" ]; then
          echo "\`\`\`" >> report.md
          cat iris-dvc-pipeline/metrics.txt >> report.md
          echo "\`\`\`" >> report.md
        else
          echo "Metrics not found" >> report.md
        fi
        echo "" >> report.md

        echo "---" >> report.md
        echo "*Production pipeline powered by MLflow + DVC*" >> report.md

    - name: Post CML report to PR
      env:
        REPO_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        cml comment create report.md
